
# Set prefix to Ctrl-Space
bind C-Space send-prefix
set -g prefix C-Space
unbind C-b

# change color
#set-option -g status-style bg=color232,fg=color8
#set-option -g status-style bg=black,fg=white
#set-option -g status-position top

set -g mouse on

set-window-option -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind r source-file ~/.tmux.conf; display-message "Reloaded config"

# bind-key -n C-j select-pane -l
# bind-key -n C-] select-pane -l
# bind-key -n M-] select-pane -l

# bind-key -n C-\\ select-pane -l

unbind -T root C-Q
bind-key -T copy-mode C-c send-keys -X cancel


# start panes in same dir
bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# change copy mode to use vim nav keys
setw -g mode-keys vi
# bind-key -T vi-copy 'v' begin-selection

#set inactive/active window styles
#set -g window-style 'fg=colour247,bg=colour236'
#set -g window-active-style 'fg=colour250,bg=black'
# set the pane border colors 
#set -g pane-border-style 'fg=colour235,bg=colour238' 
#set -g pane-active-border-style 'fg=colour51,bg=colour236'

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @resurrect-strategy-nvim 'session'

# --- Catppuccin Setup Start ---
# 1. Determine flavor (system default or override)
if-shell 'defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q "Dark"' \
    "set -g @catppuccin_flavor 'mocha'" \
    "set -g @catppuccin_flavor 'latte'"

if-shell -F '[ -n "#{@catppuccin_flavor_override}" ]' \
    "set -g @catppuccin_flavor '#{@catppuccin_flavor_override}'"

# 2. Reset and Load Plugin
set -g @catppuccin_reset "true"
set -g @plugin 'catppuccin/tmux'
run ~/.tmux/plugins/tmux/catppuccin.tmux

# 3. Configure Catppuccin (Must be AFTER plugin run due to reset)
set -g @catppuccin_window_status_style "round"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

# Pane status (requires tmux 3.4+)
if-shell "#{>=:#{version},3.4}" {
    set -g @catppuccin_pane_status_enabled "yes"
    set -g @catppuccin_pane_border_status "yes"
}

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{pane_current_path}"
# --- Catppuccin Setup End ---

# Load TPM
run ~/.tmux/plugins/tpm/tpm

# Custom status line (requires tmux 3.2+)
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
# set -g status-right "#{E:@catppuccin_status_directory}"
# set -ag status-right "#{E:@catppuccin_status_user}"
# set -ag status-right "#{E:@catppuccin_status_host}"
# set -ag status-right "#{E:@catppuccin_status_session}"

# Fix for potential distortion: clear any pre-existing status styles
set -g status-style "bg=default"
set -g status-justify "left"
